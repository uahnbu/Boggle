version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: word-rush-app
    restart: unless-stopped
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
    volumes:
      - ./backend/game_data.sqlite:/app/backend/game_data.sqlite
      - ./dictionary:/app/dictionary:ro
    networks:
      - wordgame_network

  nginx:
    image: nginx:alpine
    container_name: word-rush-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - wordgame_network

networks:
  wordgame_network:
    driver: bridge
